[project]
name = "sleep-mcp"
version = "1.0.0"
description = "Read-only MCP server exposing HealthBridge sleep data"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sleep_mcp"]
